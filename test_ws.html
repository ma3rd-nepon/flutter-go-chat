<!DOCTYPE html>
<html>
<head>
    <title>Тест WebSocket Supernova</title>
</head>
<body>
    <h2>Тест WebSocket</h2>
    <input id="messageInput" type="text" placeholder="Введи сообщение">
    <button onclick="sendMessage()">Отправить</button>
    
    <h3>Ответ от сервера:</h3>
    <ul id="messages"></ul>

    <script>
        // Подключаемся к твоему серверу
        // ВАЖНО: используем ws:// вместо http://
        const ws = new WebSocket("ws://localhost:8080/api/ws");

        const messagesList = document.getElementById("messages");

        // Когда соединение открылось
        ws.onopen = function() {
            console.log("Соединение установлено!");
            addMessage("Система: Подключено к серверу");
        };

        // Когда пришло сообщение от сервера
        ws.onmessage = function(event) {
            addMessage("Сервер: " + event.data);
        };

        // Функция отправки
        function sendMessage() {
            const input = document.getElementById("messageInput");
            const text = input.value;
            if (text) {
                ws.send(text); // Отправляем текст на сервер
                addMessage("Я: " + text);
                input.value = "";
            }
        }

        function addMessage(text) {
            const li = document.createElement("li");
            li.textContent = text;
            messagesList.appendChild(li);
        }
    </script>
</body>
</html>
