services:
  postgres:
    image: postgres:16-alpine
    container_name: supernova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: supernova
      POSTGRES_PASSWORD: supernova
      POSTGRES_DB: supernova
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supernova -d supernova"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: