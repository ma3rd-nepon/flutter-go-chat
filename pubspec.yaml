name: flutter_go_chat
description: "Messenger client."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  
  flutter_localizations: 
    sdk: flutter
  
  web_socket_channel: ^3.0.3
  path_provider: ^2.1.6
  path: ^1.9.1
  rxdart: ^0.27.7
  flutter_resizable_container: ^4.2.0
  window_manager: ^0.5.1
  google_fonts: ^8.1.0
  drift: ^2.34.0
  lucide_icons_flutter: ^3.1.14+2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.34.0
  build_runner: ^2.4.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png

flutter:
  generate: true
  assets:
  - assets/images/rabbit.png
  - assets/images/photo.jpg
  - assets/themes/base/light.json
  - assets/themes/base/dark.json
  - assets/themes/base/brown.json
  - assets/themes/base/graphite.json
  - assets/themes/accent/orange.json
  - assets/themes/accent/blue.json
  - assets/themes/accent/gray.json
  - assets/themes/accent/green.json
  - assets/themes/accent/pink.json
  - assets/themes/accent/purple.json
  - assets/themes/accent/red.json
  
  uses-material-design: true