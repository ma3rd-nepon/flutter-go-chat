name: supernova_client
description: "supernoVA client project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations: 
    sdk: flutter
  
  web_socket_channel: ^3.0.3
  dio: ^5.10.0
  path_provider: ^2.1.6
  path: ^1.9.1
  rxdart: ^0.27.7
  flutter_resizable_container: ^4.2.0
  window_manager: ^0.5.1
  google_fonts: ^8.1.0
  drift: ^2.34.0
  lucide_icons_flutter: ^3.1.14+2
  go_router: ^17.2.3
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  shared_preferences: ^2.5.5
  gap: ^3.0.1
  freezed_annotation: ^3.1.0
  pin_code_fields: ^9.4.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.34.0
  build_runner: ^2.4.0
  freezed: ^3.2.5
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png

flutter:
  uses-material-design: true
  
  assets:
   - "assets/themes/base/dark.json"
   - "assets/themes/base/light.json"
   - "assets/themes/accent/blue.json"
   - "assets/themes/accent/pink.json"
  fonts:
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf