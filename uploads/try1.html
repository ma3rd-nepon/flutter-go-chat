<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Supernova Test Client</title>

	<style>
		:root {
			--bg: #0f0f1e;
			--panel: #16213e;
			--panel2: #0f3460;
			--accent: #e94560;
			--accent2: #ff6b81;
			--text: #eeeeee;
			--muted: #888888;
			--border: #0f3460;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
		}

		body {
			background: var(--bg);
			color: var(--text);
			height: 100vh;
			overflow: hidden;
		}

		button {
			background: var(--accent);
			color: white;
			border: none;
			border-radius: 10px;
			padding: 10px 14px;
			cursor: pointer;
			font-weight: 600;
		}

		button:hover {
			background: var(--accent2);
		}

		input {
			width: 100%;
			background: var(--panel2);
			border: 1px solid var(--border);
			border-radius: 10px;
			padding: 12px 14px;
			color: var(--text);
			outline: none;
		}

		input:focus {
			border-color: var(--accent);
		}

		.hidden {
			display: none !important;
		}

		.muted {
			color: var(--muted);
		}

		.small {
			font-size: 12px;
		}

		.error {
			color: #ff6b81;
			margin-top: 12px;
			white-space: pre-wrap;
			font-size: 14px;
		}

		/* Auth */

		.auth {
			height: 100vh;
			display: grid;
			place-items: center;
			padding: 20px;
			background: linear-gradient(135deg, #0f0f1e 0%, #1a1a3e 100%);
		}

		.auth-card {
			width: 100%;
			max-width: 430px;
			background: var(--panel);
			border: 1px solid var(--border);
			border-radius: 20px;
			padding: 26px;
			box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
		}

		.auth-title {
			font-size: 32px;
			font-weight: 800;
			text-align: center;
			color: var(--accent);
			margin-bottom: 8px;
		}

		.auth-sub {
			text-align: center;
			color: var(--muted);
			margin-bottom: 18px;
		}

		.auth-tabs {
			display: flex;
			gap: 10px;
			margin-bottom: 16px;
		}

		.auth-tabs button {
			flex: 1;
			background: var(--panel2);
		}

		.auth-tabs button.active {
			background: var(--accent);
		}

		.auth-form {
			display: flex;
			flex-direction: column;
			gap: 10px;
		}

		/* App */

		.app {
			display: grid;
			grid-template-columns: 360px 1fr;
			height: 100vh;
		}

		.sidebar {
			background: var(--panel);
			border-right: 1px solid var(--border);
			display: flex;
			flex-direction: column;
			min-width: 0;
		}

		.me {
			display: flex;
			align-items: center;
			gap: 12px;
			padding: 16px;
			border-bottom: 1px solid var(--border);
		}

		.avatar {
			width: 46px;
			height: 46px;
			border-radius: 50%;
			background: var(--accent);
			display: grid;
			place-items: center;
			font-weight: 800;
			color: white;
			flex: 0 0 auto;
		}

		.avatar.small {
			width: 34px;
			height: 34px;
			font-size: 14px;
		}

		.panel {
			padding: 14px;
			border-bottom: 1px solid var(--border);
			display: flex;
			flex-direction: column;
			gap: 8px;
		}

		.panel .row {
			display: flex;
			gap: 8px;
		}

		.list {
			flex: 1;
			overflow: auto;
			padding: 8px;
		}

		.chat-item,
		.user-item {
			display: flex;
			align-items: center;
			gap: 10px;
			padding: 10px;
			border-radius: 14px;
			cursor: pointer;
			border: 1px solid transparent;
		}

		.chat-item:hover,
		.user-item:hover {
			background: rgba(233, 69, 96, 0.1);
		}

		.chat-item.active {
			border-color: var(--accent);
			background: rgba(233, 69, 96, 0.16);
		}

		.grow {
			flex: 1;
			min-width: 0;
		}

		.title {
			font-weight: 700;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.subtitle {
			color: var(--muted);
			font-size: 13px;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.main {
			display: flex;
			flex-direction: column;
			min-width: 0;
		}

		.chat-header {
			padding: 16px 20px;
			background: var(--panel);
			border-bottom: 1px solid var(--border);
		}

		.messages {
			flex: 1;
			overflow: auto;
			padding: 18px;
			display: flex;
			flex-direction: column;
			gap: 10px;
			background: linear-gradient(180deg, #0f0f1e 0%, #12151c 100%);
		}

		.msg {
			max-width: 70%;
			padding: 10px 14px;
			border-radius: 16px;
			background: var(--panel);
			border: 1px solid var(--border);
			white-space: pre-wrap;
			word-break: break-word;
		}

		.msg.own {
			align-self: flex-end;
			background: var(--accent);
			border-color: var(--accent);
			color: white;
		}

		.msg.other {
			align-self: flex-start;
		}

		.msg .meta {
			font-size: 11px;
			opacity: 0.75;
			margin-bottom: 5px;
		}

		.msg img {
			max-width: 280px;
			max-height: 280px;
			border-radius: 10px;
			display: block;
			margin-top: 6px;
		}

		.input-row {
			display: flex;
			gap: 10px;
			padding: 16px;
			background: var(--panel);
			border-top: 1px solid var(--border);
		}

		.empty {
			flex: 1;
			display: grid;
			place-items: center;
			color: var(--muted);
			text-align: center;
			padding: 30px;
		}

		.debug {
			position: fixed;
			right: 12px;
			bottom: 12px;
			width: 380px;
			max-height: 240px;
			overflow: auto;
			background: rgba(0, 0, 0, 0.78);
			border: 1px solid var(--border);
			border-radius: 12px;
			padding: 10px;
			font-family: monospace;
			font-size: 12px;
			white-space: pre-wrap;
			z-index: 999;
		}
	</style>
</head>

<body>
	<!-- AUTH -->
	<div id="authView" class="auth">
		<div class="auth-card">
			<div class="auth-title">🚀 Supernova</div>
			<div class="auth-sub">Тестовый клиент под текущий бэкенд</div>

			<div class="auth-tabs">
				<button id="tabLogin" class="active" onclick="showAuthTab('login')">Вход</button>
				<button id="tabRegister" onclick="showAuthTab('register')">Регистрация</button>
			</div>

			<div id="loginForm" class="auth-form">
				<input id="loginEmail" placeholder="Email" value="user1@example.com">
				<input id="loginPassword" type="password" placeholder="Пароль" value="password123">
				<button onclick="login()">Войти</button>
			</div>

			<div id="registerForm" class="auth-form hidden">
				<input id="regEmail" placeholder="Email">
				<input id="regPassword" type="password" placeholder="Пароль (минимум 8 символов)">
				<input id="regDisplayName" placeholder="Display name (обязательно)">
				<input id="regUsername" placeholder="Username (необязательно)">

				<div class="row" style="display:flex;gap:8px;">
					<button onclick="fillRandomUser()" style="flex:1;background:var(--panel2)">Случайный юзер</button>
					<button onclick="register()" style="flex:1">Зарегистрироваться</button>
				</div>
			</div>

			<div id="authError" class="error"></div>
		</div>
	</div>

	<!-- APP -->
	<div id="appView" class="app hidden">
		<aside class="sidebar">
			<div class="me">
				<div class="avatar" id="meAvatar">?</div>

				<div class="grow">
					<div id="meName" class="title">user</div>
					<div id="meEmail" class="subtitle">email</div>
				</div>

				<button onclick="logout()">Выйти</button>
			</div>

			<div class="panel">
				<div class="muted small">Поиск пользователей</div>
				<input id="userSearch" placeholder="Email или имя">
				<button onclick="searchUsers()">Найти пользователей</button>
				<div id="userResults"></div>
			</div>

			<div class="panel">
				<div class="muted small">Создать группу</div>
				<input id="groupName" placeholder="Название группы">
				<div class="row">
					<button onclick="createGroup()" style="flex:1">Создать</button>
					<button onclick="loadChats()" style="flex:1;background:var(--panel2)">Обновить чаты</button>
				</div>
			</div>

			<div id="chatList" class="list"></div>
		</aside>

		<main class="main">
			<div id="noChat" class="empty">
				<div>
					<h2>Выбери чат</h2>
					<p>Или создай группу / начни личный чат через поиск пользователей.</p>
				</div>
			</div>

			<div id="chatView" class="hidden" style="display:flex;flex-direction:column;height:100%">
				<div class="chat-header">
					<div id="chatTitle" class="title">Чат</div>
					<div id="chatSub" class="subtitle"></div>
				</div>

				<div id="messages" class="messages"></div>

				<div class="input-row">
					<input id="messageInput" placeholder="Напиши сообщение..." onkeydown="if (event.key === 'Enter') sendMessage()">
					<button onclick="sendMessage()">Отправить</button>
				</div>
			</div>
		</main>
	</div>

	<div id="debug" class="debug"></div>

	<script>
		const API_BASE = window.location.protocol.startsWith("http")
			? ""
			: "http://localhost:8080";

		const state = {
			user: null,
			chats: [],
			currentChat: null,
			messages: [],
			ws: null,
			lastUsers: [],
			privateTitles: {}
		};

		// Utils

		function $(id) {
			return document.getElementById(id);
		}

		function val(id) {
			return $(id).value.trim();
		}

		function esc(value) {
			return String(value ?? "")
				.replaceAll("&", "&amp;")
				.replaceAll("<", "&lt;")
				.replaceAll(">", "&gt;")
				.replaceAll('"', "&quot;")
				.replaceAll("'", "&#39;");
		}

		function log(message) {
			const el = $("debug");
			const time = new Date().toLocaleTimeString();

			el.textContent = `[${time}] ${message}\n` + el.textContent;
		}

		function initials(name) {
			if (!name) return "?";

			return name
				.trim()
				.split(/\s+/)
				.slice(0, 2)
				.map(x => x[0]?.toUpperCase() || "")
				.join("");
		}

		function showAuthError(message) {
			$("authError").textContent = message;
		}

		// API

		async function api(method, path, body) {
			const headers = {};

			const token = localStorage.getItem("sn_token");

			if (token) {
				headers["Authorization"] = "Bearer " + token;
			}

			let payload;

			if (body !== undefined && body !== null) {
				headers["Content-Type"] = "application/json";
				payload = JSON.stringify(body);
			}

			const res = await fetch(API_BASE + path, {
				method,
				headers,
				body: payload
			});

			const text = await res.text();

			let data;

			try {
				data = JSON.parse(text);
			} catch {
				data = {
					success: false,
					error: {
						message: text || ("HTTP " + res.status)
					}
				};
			}

			if (res.status === 401 && !path.startsWith("/auth/")) {
				log("401, разлогиниваемся");
				logout();
				throw new Error("Сессия истекла");
			}

			if (!data.success) {
				let message = data.error?.message || ("HTTP " + res.status);

				if (Array.isArray(data.error?.details) && data.error.details.length) {
					message += "\n" + data.error.details
						.map(d => `${d.field || "_"}: ${d.issue}`)
						.join("\n");
				}

				throw new Error(message);
			}

			return data.data;
		}

		// Auth

		function showAuthTab(tab) {
			showAuthError("");

			if (tab === "login") {
				$("loginForm").classList.remove("hidden");
				$("registerForm").classList.add("hidden");
				$("tabLogin").classList.add("active");
				$("tabRegister").classList.remove("active");
			} else {
				$("loginForm").classList.add("hidden");
				$("registerForm").classList.remove("hidden");
				$("tabLogin").classList.remove("active");
				$("tabRegister").classList.add("active");
			}
		}

		function fillRandomUser() {
			const n = Math.floor(Math.random() * 1000000);

			$("regEmail").value = `user${n}@example.com`;
			$("regPassword").value = "password123";
			$("regDisplayName").value = `User ${n}`;
			$("regUsername").value = `user${n}`;

			showAuthError("");
		}

		function saveSession(data) {
			localStorage.setItem("sn_token", data.access_token);
			localStorage.setItem("sn_refresh_token", data.refresh_token || "");
			localStorage.setItem("sn_user", JSON.stringify(data.user));

			state.user = data.user;
		}

		async function register() {
			showAuthError("");

			const body = {
				email: val("regEmail"),
				password: val("regPassword"),
				display_name: val("regDisplayName")
			};

			if (val("regUsername")) {
				body.username = val("regUsername");
			}

			try {
				log("register: " + body.email);

				const data = await api("POST", "/auth/register", body);

				saveSession(data);
				log("register success");

				enterApp();
			} catch (err) {
				log("register error: " + err.message);
				showAuthError(err.message);
			}
		}

		async function login() {
			showAuthError("");

			const body = {
				email: val("loginEmail"),
				password: val("loginPassword")
			};

			try {
				log("login: " + body.email);

				const data = await api("POST", "/auth/login", body);

				saveSession(data);
				log("login success");

				enterApp();
			} catch (err) {
				log("login error: " + err.message);
				showAuthError(err.message);
			}
		}

		function logout() {
			localStorage.removeItem("sn_token");
			localStorage.removeItem("sn_refresh_token");
			localStorage.removeItem("sn_user");

			if (state.ws) {
				state.ws.close();
				state.ws = null;
			}

			location.reload();
		}

		// App

		function enterApp() {
			$("authView").classList.add("hidden");
			$("appView").classList.remove("hidden");

			renderMe();
			connectWebSocket();
			loadChats();
		}

		function renderMe() {
			if (!state.user) return;

			$("meAvatar").textContent = initials(state.user.display_name);
			$("meName").textContent = state.user.display_name +
				(state.user.username ? " @" + state.user.username : "");
			$("meEmail").textContent = state.user.email || "";
		}

		// Chats

		async function loadChats() {
			try {
				const data = await api("GET", "/chats?limit=100");

				state.chats = data.items || [];

				renderChats();
			} catch (err) {
				log("loadChats error: " + err.message);
			}
		}

		function chatDisplayName(chat) {
			if (chat.title) {
				return chat.title;
			}

			if (state.privateTitles[chat.id]) {
				return state.privateTitles[chat.id];
			}

			if (chat.type === "private") {
				return "Private chat";
			}

			return "Chat";
		}

		function renderChats() {
			const container = $("chatList");

			if (!state.chats.length) {
				container.innerHTML = `<div class="muted small" style="padding:12px">Нет чатов</div>`;
				return;
			}

			container.innerHTML = state.chats.map(chat => {
				const active = state.currentChat?.id === chat.id ? "active" : "";
				const name = chatDisplayName(chat);

				const subtitle =
					`${esc(chat.type)} · участников: ${chat.member_count ?? 0}` +
					(chat.unread_count ? ` · unread: ${chat.unread_count}` : "");

				return `
					<div class="chat-item ${active}" onclick="openChat('${chat.id}')">
						<div class="avatar">${esc(initials(name))}</div>

						<div class="grow">
							<div class="title">${esc(name)}</div>
							<div class="subtitle">${subtitle}</div>
						</div>
					</div>
				`;
			}).join("");
		}

		async function createGroup() {
			const title = val("groupName");

			if (!title) {
				log("group title is required");
				return;
			}

			try {
				const chat = await api("POST", "/chats", {
					type: "group",
					title,
					member_ids: []
				});

				log("group created: " + chat.id);

				$("groupName").value = "";

				await loadChats();
				await openChat(chat.id);
			} catch (err) {
				log("createGroup error: " + err.message);
			}
		}

		async function openChat(chatId) {
			try {
				let chat = state.chats.find(x => x.id === chatId);

				if (!chat) {
					chat = await api("GET", "/chats/" + chatId);
				}

				state.currentChat = chat;

				$("noChat").classList.add("hidden");
				$("chatView").classList.remove("hidden");

				$("chatTitle").textContent = chatDisplayName(chat);
				$("chatSub").textContent =
					`${chat.type} · участников: ${chat.member_count ?? 0}`;

				renderChats();

				await loadMessages();
			} catch (err) {
				log("openChat error: " + err.message);
			}
		}

		// Users

		async function searchUsers() {
			const q = val("userSearch");

			if (!q) {
				$("userResults").innerHTML = "";
				return;
			}

			try {
				const data = await api("GET", "/users?q=" + encodeURIComponent(q));

				state.lastUsers = (data.items || []).filter(user => {
					return !state.user || user.id !== state.user.id;
				});

				renderUsers();
			} catch (err) {
				log("searchUsers error: " + err.message);
			}
		}

		function renderUsers() {
			const container = $("userResults");

			if (!state.lastUsers.length) {
				container.innerHTML = `<div class="muted small" style="padding:8px 0">Никого не найдено</div>`;
				return;
			}

			container.innerHTML = state.lastUsers.map(user => {
				const name = user.display_name || user.username || "User";

				return `
					<div class="user-item">
						<div class="avatar small">${esc(initials(name))}</div>

						<div class="grow">
							<div class="title">${esc(name)}</div>
							<div class="subtitle">${user.username ? "@" + esc(user.username) : ""}</div>
						</div>

						<button onclick="startPrivateChat('${user.id}')">Чат</button>
					</div>
				`;
			}).join("");
		}

		async function startPrivateChat(userId) {
			try {
				const user = state.lastUsers.find(x => x.id === userId);

				const chat = await api("POST", "/chats", {
					type: "private",
					member_ids: [userId]
				});

				if (user) {
					state.privateTitles[chat.id] = user.display_name || user.username || "Private chat";
				}

				log("private chat created/opened: " + chat.id);

				await loadChats();
				await openChat(chat.id);
			} catch (err) {
				log("startPrivateChat error: " + err.message);
			}
		}

		// Messages

		async function loadMessages() {
			if (!state.currentChat) return;

			try {
				const data = await api("GET", `/chats/${state.currentChat.id}/messages?limit=100`);

				state.messages = (data.items || []).slice().reverse();

				renderMessages();

				await markRead();
			} catch (err) {
				log("loadMessages error: " + err.message);
			}
		}

		function renderMessages() {
			const container = $("messages");

			if (!state.messages.length) {
				container.innerHTML = `<div class="muted">Нет сообщений</div>`;
				return;
			}

			container.innerHTML = state.messages.map(messageHtml).join("");

			container.scrollTop = container.scrollHeight;
		}

		function messageHtml(message) {
			const own = state.user && message.sender_id === state.user.id;

			const time = message.created_at
				? new Date(message.created_at * 1000).toLocaleTimeString([], {
					hour: "2-digit",
					minute: "2-digit"
				})
				: "";

			let sender = "System";

			if (own) {
				sender = "Вы";
			} else if (message.sender_id) {
				sender = "User " + String(message.sender_id).slice(0, 8);
			}

			let content = "";

			if (message.is_deleted) {
				content = `<em>Сообщение удалено</em>`;
			} else {
				if (message.attachment_url) {
					if (message.kind === "image") {
						content += `<img src="${esc(message.attachment_url)}" alt="image">`;
					} else {
						content += `<a href="${esc(message.attachment_url)}" target="_blank">Вложение</a><br>`;
					}
				}

				if (message.text) {
					content += `<div>${esc(message.text)}</div>`;
				}
			}

			return `
				<div class="msg ${own ? "own" : "other"}">
					<div class="meta">${esc(sender)} · ${esc(time)}</div>
					${content}
				</div>
			`;
		}

		async function sendMessage() {
			if (!state.currentChat) {
				log("no chat selected");
				return;
			}

			const text = val("messageInput");

			if (!text) return;

			try {
				const message = await api("POST", `/chats/${state.currentChat.id}/messages`, {
					text
				});

				$("messageInput").value = "";

				addMessage(message);
			} catch (err) {
				log("sendMessage error: " + err.message);
			}
		}

		function addMessage(message) {
			if (!state.currentChat || message.chat_id !== state.currentChat.id) {
				loadChats();
				return;
			}

			if (state.messages.some(x => x.id === message.id)) {
				return;
			}

			state.messages.push(message);

			const container = $("messages");

			container.insertAdjacentHTML("beforeend", messageHtml(message));
			container.scrollTop = container.scrollHeight;

			markRead();
		}

		function updateMessage(message) {
			if (!state.currentChat || message.chat_id !== state.currentChat.id) {
				return;
			}

			const index = state.messages.findIndex(x => x.id === message.id);

			if (index === -1) {
				return;
			}

			state.messages[index] = {
				...state.messages[index],
				...message
			};

			renderMessages();
		}

		async function markRead() {
			if (!state.currentChat || !state.messages.length) {
				return;
			}

			const last = state.messages[state.messages.length - 1];

			try {
				await api("POST", `/chats/${state.currentChat.id}/read`, {
					last_message_id: last.id
				});
			} catch {
				// ignore
			}
		}

		// WebSocket

		function connectWebSocket() {
			const token = localStorage.getItem("sn_token");

			if (!token) return;

			if (state.ws) {
				state.ws.close();
			}

			const host = window.location.host || "localhost:8080";
			const proto = window.location.protocol === "https:" ? "wss" : "ws";

			const url = `${proto}://${host}/ws?token=` + encodeURIComponent(token);

			log("connecting WS: " + url);

			state.ws = new WebSocket(url);

			state.ws.onopen = () => {
				log("WS connected");
			};

			state.ws.onmessage = event => {
				let payload;

				try {
					payload = JSON.parse(event.data);
				} catch {
					return;
				}

				handleWebSocketEvent(payload);
			};

			state.ws.onclose = () => {
				log("WS closed");

				if (localStorage.getItem("sn_token")) {
					setTimeout(connectWebSocket, 3000);
				}
			};

			state.ws.onerror = () => {
				log("WS error");
			};
		}

		function handleWebSocketEvent(event) {
			switch (event.event) {
				case "new_message": {
					const message = event.data?.message;

					if (!message) break;

					if (state.currentChat && message.chat_id === state.currentChat.id) {
						addMessage(message);
					} else {
						loadChats();
					}

					break;
				}

				case "message_updated":
				case "message_deleted": {
					const message = event.data?.message;

					if (message) {
						updateMessage(message);
					}

					break;
				}

				case "chat_updated":
				case "chat_deleted": {
					loadChats();
					break;
				}
			}
		}

		// Init

		async function init() {
			const token = localStorage.getItem("sn_token");
			const savedUser = localStorage.getItem("sn_user");

			if (!token || !savedUser) {
				return;
			}

			try {
				state.user = JSON.parse(savedUser);

				const me = await api("GET", "/users/me");

				state.user = me;
				localStorage.setItem("sn_user", JSON.stringify(me));

				enterApp();
			} catch {
				localStorage.removeItem("sn_token");
				localStorage.removeItem("sn_refresh_token");
				localStorage.removeItem("sn_user");
			}
		}

		init();
	</script>
</body>
</html>
